# Publica documentação (MD→HTML+PDF) e ajuda estática em GitHub Pages a cada push em main.
# Páginas MD: docs/mds/*.md → docs/html/*.html (Pandoc) + docs/pdfs/*.pdf (Docker pandoc/extra).
# Artefacto _site/: index + *.html na raiz + /help/ (URLs planas; ver docs/README.md).
# Activar em: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Pull Docker image for PDFs
        run: docker pull pandoc/extra:3.1

      - name: Assemble site
        run: |
          chmod +x scripts/docs/build-pages-site.sh
          scripts/docs/build-pages-site.sh "$GITHUB_WORKSPACE/_site"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
