services:
  db:
    image: postgis/postgis:15-3.3
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tabgis_admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: tabgis_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  geoserver:
    image: oscarfonts/geoserver:latest
    ports:
      - "8080:8080"
    environment:
      - INSTALL_EXTENSIONS=true
    depends_on:
      - db

  tileserver:
    image: maptiler/tileserver-gl:latest
    ports:
      - "8081:8080"
    volumes:
      - ../data/tiles:/data:ro
    command: ["--config", "/data/config.json"]
    restart: unless-stopped

  api:
    build: ../backend
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: tabgis_db
      DB_USER: tabgis_admin
      DB_PASSWORD: password123
    depends_on:
      - db
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports:
      - "8088:80"
    volumes:
      - ../frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - geoserver
      - tileserver

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data:
